[project]
name = "decision-routed-lab"
version = "0.1.0"
description = "Minimal LangGraph laboratory workflow and independent evaluation harness"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.0,<3", "httpx==0.28.1", "jsonschema==4.26.0", "numpy==2.4.3", "scipy==1.17.1", "opencv-python-headless==4.13.0.92", "pillow==12.1.1", "CoolProp==7.2.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
