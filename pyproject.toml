[project]
name = "decision-routed-lab"
version = "0.1.0"
description = "Minimal LangGraph laboratory workflow and independent evaluation harness"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "pydantic>=2.0,<3", "httpx==0.28.1", "jsonschema==4.26.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
